[pytest]
markers =
    integration: requires a live Exasol instance

# --import-mode=importlib lets two modules' tests/ directories carry test files
# with the SAME basename. Without it, the documented first step of authoring a
# module — `cp -r modules/_template modules/<name>/` — leaves two
# `tests/test_template.py` files in the tree and pytest aborts COLLECTION OF THE
# WHOLE SUITE with "import file mismatch", an error that names neither the
# template nor the copy as the thing to fix. Renaming the copied file is still
# the right thing to do (see modules/_template/README.md step 5), but a
# newcomer's first `pytest` run should fail on their module, not on the
# collector.
#
# pythonpath restores what importlib mode takes away: under it a test file's own
# directory is no longer added to sys.path, so tests/test_scaffolding.py and
# tests/test_library_modules.py could not `from _stamping import stamping_args`.
addopts = --import-mode=importlib
pythonpath = tests
