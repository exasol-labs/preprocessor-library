# CI workflow for preprocessor-library
#
# Two jobs:
#   drift-check — installs the framework package, regenerates
#                 registry/index.json from modules/*/module.toml plus
#                 registry/external/*.toml (fails if the committed file is out
#                 of sync), and runs tests/test_library_modules.py, which
#                 confirms every module's declared [[objects]] inventory
#                 agrees with its artifact's independently parsed inventory —
#                 the same accept/reject discipline already applied to
#                 sha256. Neither check needs a database, so this job always
#                 runs.
#   test         — installs the framework package, boots a docker Exasol
#                 (same image the framework's own CI uses), installs the
#                 framework core into it, and runs every module's tests/
#                 (plus the top-level tests/, including
#                 tests/test_library_modules.py again as part of the full
#                 suite).
#
# The framework is not published to PyPI yet, so it is installed straight from
# its GitHub repo, pinned to `main`. That repo is PRIVATE, so both jobs install
# it with an optional FRAMEWORK_TOKEN secret (a PAT or GitHub App token with
# read access to it). When the secret is absent these framework-dependent checks
# skip cleanly and the pipeline stays green; add the secret to turn them on. The
# release-package build lives in release.yml and needs neither the framework nor
# a token (it is stdlib-only).

name: CI

on:
  push:
  pull_request:

env:
  # Must resolve a framework build that has the version-stamped index generator
  # (generate_index/index_drift accept library_version) and the optional-FROM +
  # provenance-audit install path. That work is now on framework `main`; pin to
  # the first framework release tag that carries it once one is cut.
  FRAMEWORK_REF: main

jobs:

  # ---------------------------------------------------------------------------
  # drift-check: registry/index.json must always match modules/*/module.toml
  # and registry/external/*.toml
  # ---------------------------------------------------------------------------
  drift-check:
    name: Registry index drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The framework repo is private, so an anonymous clone cannot install it.
      # Authenticate with an optional FRAMEWORK_TOKEN secret (a PAT or GitHub App
      # token with read access to exasol-labs/preprocessor-framework). When the
      # secret is not configured, skip the framework-dependent check cleanly so
      # the pipeline stays green — the release-package build (release.yml) is
      # stdlib-only and validates the artifacts independently.
      - name: Install the framework package
        env:
          FRAMEWORK_TOKEN: ${{ secrets.FRAMEWORK_TOKEN }}
        run: |
          if [ -z "$FRAMEWORK_TOKEN" ]; then
            echo "::notice::FRAMEWORK_TOKEN not set — skipping the framework-dependent drift check."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          pip install "preprocessor-framework @ git+https://x-access-token:${FRAMEWORK_TOKEN}@github.com/exasol-labs/preprocessor-framework.git@${FRAMEWORK_REF}" pytest

      # scripts/generate_index.py owns the stamping convention (library_version
      # from ./VERSION, source.ref = v<VERSION>); --check regenerates with those
      # same values and fails on any drift, so the writer and the check can never
      # diverge. Do NOT hand-edit registry/index.json — run the writer.
      - name: Check registry/index.json is in sync
        if: env.SKIP != '1'
        run: python scripts/generate_index.py --check

      # Static, no-database checks: every module's declared [[objects]]
      # inventory (or its N=1 fallback) must agree with what tooling
      # independently parses from its artifact, in both directions. A
      # disagreement fails the build exactly like a sha256 mismatch does.
      - name: Check declared object inventories match parsed artifacts
        if: env.SKIP != '1'
        run: python -m pytest tests/test_library_modules.py -v

  # ---------------------------------------------------------------------------
  # test: every module's tests/ against a docker Exasol with the framework
  # installed
  # ---------------------------------------------------------------------------
  test:
    name: Module tests (docker Exasol)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Needs the private framework package (see the drift-check note). Skips the
      # DB-backed module tests cleanly when FRAMEWORK_TOKEN is not configured.
      - name: Install the framework package and test dependencies
        env:
          FRAMEWORK_TOKEN: ${{ secrets.FRAMEWORK_TOKEN }}
        run: |
          if [ -z "$FRAMEWORK_TOKEN" ]; then
            echo "::notice::FRAMEWORK_TOKEN not set — skipping the framework-dependent module tests."
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          pip install "preprocessor-framework @ git+https://x-access-token:${FRAMEWORK_TOKEN}@github.com/exasol-labs/preprocessor-framework.git@${FRAMEWORK_REF}" pytest

      # Start the Exasol database container — same image and flags the
      # framework repo's own CI uses.
      - name: Start Exasol docker-db
        if: env.SKIP != '1'
        run: |
          docker run -d \
            --name exasol \
            --privileged \
            -p 8563:8563 \
            exasol/docker-db:latest-8

      # Poll until the database is ready to accept connections.
      - name: Wait for Exasol to be ready
        if: env.SKIP != '1'
        run: |
          python - <<'EOF'
          import time, sys
          import pyexasol

          dsn      = "localhost:8563"
          user     = "sys"
          password = "exasol"
          timeout  = 600   # seconds — docker-db is slow on a cold runner
          interval = 10    # seconds between polls
          deadline = time.time() + timeout

          print("Waiting for Exasol to accept connections …", flush=True)
          while time.time() < deadline:
              try:
                  conn = pyexasol.connect(
                      dsn=dsn, user=user, password=password,
                      websocket_sslopt={"cert_reqs": 0},
                  )
                  conn.close()
                  print("Exasol is ready.", flush=True)
                  sys.exit(0)
              except Exception as exc:
                  print(f"  not ready yet ({exc}); retrying in {interval}s …", flush=True)
                  time.sleep(interval)

          print("ERROR: Exasol did not become ready within the timeout.", file=sys.stderr)
          sys.exit(1)
          EOF

      # Run every module's tests/ plus the top-level scaffolding tests.
      - name: Run pytest
        if: env.SKIP != '1'
        env:
          EXASOL_DSN: "localhost:8563"
          EXASOL_USER: sys
          EXASOL_PASSWORD: exasol
          # Disable TLS verification — docker-db uses a self-signed certificate.
          EXASOL_TLS_VERIFY: "0"
        run: pytest -v
