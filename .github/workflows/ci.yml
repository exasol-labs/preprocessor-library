# CI workflow for preprocessor-library
#
# Two jobs:
#   drift-check — installs the framework package, regenerates
#                 registry/index.json from modules/*/module.toml plus
#                 registry/external/*.toml (fails if the committed file is out
#                 of sync), and runs the WHOLE top-level tests/ directory: the
#                 declared-vs-parsed [[objects]] inventory and sha256 gates in
#                 tests/test_library_modules.py AND the artifact/manifest/layout
#                 conformance gates in tests/test_scaffolding.py. Not one test
#                 under tests/ touches a database, so all of it belongs in the
#                 job that always runs. Running only test_library_modules.py
#                 here left the scaffolding gates reachable solely through the
#                 heavy `test` job below, which needs a docker Exasol.
#   test         — installs the framework package, boots a docker Exasol
#                 (same image the framework's own CI uses), installs the
#                 framework core into it, and runs every module's tests/
#                 (plus the top-level tests/ again as part of the full suite).
#
# Both jobs install requirements-test.txt, which is where this repo declares
# what its suites need. `lupa` in particular is load-bearing: a module's
# in-process Lua rewrite check SKIPS SILENTLY when lupa is absent, so leaving it
# to an ad-hoc `pip install` line in one job is how that check goes dark.
#
# The framework is not published to PyPI yet. Both jobs install it from its
# public GitHub repository via requirements-test.txt. The release-package build
# in release.yml remains stdlib-only.

name: CI

on:
  push:
  pull_request:

jobs:

  # ---------------------------------------------------------------------------
  # drift-check: every gate that does NOT need a database. registry/index.json
  # must match modules/*/module.toml and registry/external/*.toml, and the whole
  # of tests/ must pass — the sha256 + inventory gates and the layout/manifest
  # conformance gates alike. The job id and display name are kept as they are so
  # existing branch-protection required checks keep resolving; only its scope
  # widened.
  # ---------------------------------------------------------------------------
  drift-check:
    name: Registry index drift check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the framework package and test dependencies
        run: pip install -r requirements-test.txt

      # scripts/generate_index.py owns the stamping convention (library_version
      # from ./VERSION, source.ref = v<VERSION>); --check regenerates with those
      # same values and fails on any drift, so the writer and the check can never
      # diverge. Do NOT hand-edit registry/index.json — run the writer.
      - name: Check registry/index.json is in sync
        run: python scripts/generate_index.py --check

      # The whole no-database suite: every module's declared [[objects]]
      # inventory (or its N=1 fallback) must agree with what tooling
      # independently parses from its artifact, in both directions, its sha256
      # must match its artifact's bytes, and every module must satisfy the layout
      # and manifest conformance gates. A disagreement fails the build exactly
      # like a sha256 mismatch does. Run tests/ as a DIRECTORY, not a file list,
      # so a conformance gate added under tests/ is picked up here by default
      # instead of only in the docker-Exasol job.
      - name: Run the no-database gates (inventory, sha256, layout conformance)
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # test: every module's tests/ against a docker Exasol with the framework
  # installed
  # ---------------------------------------------------------------------------
  test:
    name: Module tests (docker Exasol)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the framework package and test dependencies
        run: pip install -r requirements-test.txt

      # Start the Exasol database container — same image and flags the
      # framework repo's own CI uses.
      - name: Start Exasol docker-db
        run: |
          docker run -d \
            --name exasol \
            --privileged \
            -p 8563:8563 \
            exasol/docker-db:latest-8

      # Poll until the database is ready to accept connections.
      - name: Wait for Exasol to be ready
        run: |
          python - <<'EOF'
          import time, sys
          import pyexasol

          dsn      = "localhost:8563"
          user     = "sys"
          password = "exasol"
          timeout  = 600   # seconds — docker-db is slow on a cold runner
          interval = 10    # seconds between polls
          deadline = time.time() + timeout

          print("Waiting for Exasol to accept connections …", flush=True)
          while time.time() < deadline:
              try:
                  conn = pyexasol.connect(
                      dsn=dsn, user=user, password=password,
                      websocket_sslopt={"cert_reqs": 0},
                  )
                  conn.close()
                  print("Exasol is ready.", flush=True)
                  sys.exit(0)
              except Exception as exc:
                  print(f"  not ready yet ({exc}); retrying in {interval}s …", flush=True)
                  time.sleep(interval)

          print("ERROR: Exasol did not become ready within the timeout.", file=sys.stderr)
          sys.exit(1)
          EOF

      # Run every module's tests/ plus the top-level scaffolding tests.
      - name: Run pytest
        env:
          EXASOL_DSN: "localhost:8563"
          EXASOL_USER: sys
          EXASOL_PASSWORD: exasol
          # Disable TLS verification — docker-db uses a self-signed certificate.
          EXASOL_TLS_VERIFY: "0"
        run: pytest -v
