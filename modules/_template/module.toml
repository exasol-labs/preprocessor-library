# =============================================================================
# TEMPLATE module.toml
# =============================================================================
# Copy this whole modules/_template/ directory to modules/<your-module-name>/,
# rename its files, and replace every value below with your own. The full
# field reference lives in docs/module-authoring.md in the
# preprocessor-framework repo ("module.toml schema").
#
# NOTE for template maintainers: this manifest is intentionally a complete,
# valid, harmless module (a TRANSLATE no-op) rather than a stub — the
# registry generator auto-indexes every modules/*/module.toml it finds, so a
# deliberately-invalid template would break `preproc module list` / CI's
# index regeneration for every module, not just this one. `name` here MUST
# keep matching this directory's name (`_template`) for the same reason:
# the generator resolves the artifact file from `name`, not from the
# directory it was found in.
# =============================================================================

name = "_template"                            # kebab-case; MUST match the modules/<name>/ directory
description = "Placeholder TRANSLATE-phase template module. Copy this directory to start a new one."
phase = "TRANSLATE"                           # one of: TRANSLATE, EXPAND, REWRITE
script_name = "PREPROC_RT.TEMPLATE_MODULE_V1" # fully qualified; MUST end in _V<N>
function = "template_module"                  # the exported Lua function name
version = 1                                   # MUST equal the _V<N> suffix above
min_framework = "0.3.0"                       # lowest framework release this module supports
sha256 = "c9d06b070443c936672190b9c0deb09638160f2481095e198f9590a8d33ff9c5"  # hex digest of _template_v1.sql's bytes
deploy_mode = "library-deployed"              # "library-deployed" or "self-deployed" (self-deployed needs [source] instead of sha256)

[suggested_scope]
type = "ROLE"                                 # "ROLE" or "USER"
value = "PREPROC_ADMIN"                       # a default scope suggestion; the operator may deploy with a different scope

# =============================================================================
# [[objects]] — the object inventory (composite artifacts)
# =============================================================================
# This template's artifact (_template_v1.sql) is a single CREATE OR REPLACE
# LUA SCRIPT statement, so [[objects]] is OPTIONAL here: the inventory is
# derived as the single entry named by script_name above, exactly what every
# existing single-statement module (cast_shorthand, trailing_comma) already
# satisfies unedited.
#
# [[objects]] becomes REQUIRED once your artifact carries MORE THAN ONE
# statement — e.g. a Lua entry script plus a Python UDF or a table your
# subsystem needs. Declare one [[objects]] table per object the artifact
# creates, each with:
#   type  - the DDL kind, e.g. "LUA SCRIPT", "PYTHON3 SCALAR SCRIPT", "TABLE"
#   name  - the fully-qualified deployed name, e.g. "PREPROC_RT.MY_MODULE_V1"
# EVERY declared name MUST carry this module's _V<N> suffix (the entry script
# AND every companion, not only the entry script) so a v1 and a v2 generation
# coexist without collisions. Tooling independently parses the artifact and
# rejects the module if the declared and parsed inventories disagree in
# EITHER direction — the same accept/reject discipline already applied to
# sha256.
#
# Separate multiple statements in the .sql artifact using the EXAplus
# block-marker convention: wrap a statement whose body contains semicolons
# (a Lua/Python script body) between a line that is solely "--/" and a line
# that is solely "/"; terminate any other statement with ";". See
# _template_v1.sql for a worked single-statement example and
# docs/module-authoring.md ("The canonical artifact") in the
# preprocessor-framework repo for the full grammar and a worked
# composite (Lua entry + Python UDF) example.
#
# Example for a two-object composite module (NOT active here - this
# template stays single-statement; copy this shape into your own
# module.toml once your artifact grows a companion object):
#
# [[objects]]
# type = "LUA SCRIPT"
# name = "PREPROC_RT.MY_MODULE_V1"
#
# [[objects]]
# type = "PYTHON3 SCALAR SCRIPT"
# name = "PREPROC_RT.MY_MODULE_HELPER_V1"
# =============================================================================
